version: "3.9"

services:
  db:
    image: postgres:18-alpine
    container_name: music-db
    environment:
      POSTGRES_DB: music-library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    networks:
      - music-network

  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=rootpass123
      - MINIO_DEFAULT_BUCKETS=bucket
      - MINIO_SERVER_URL=http://localhost:9000
    networks:
      - music-network
    volumes:
      - minio-volume:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: [ "server","/data", "--console-address", ":9001" ]

networks:
  music-network:
    driver: bridge

volumes:
  minio-volume:
    driver: local
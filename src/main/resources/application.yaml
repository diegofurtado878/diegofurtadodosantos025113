server:
  port: 8080

spring:
  application:
    name: music-library-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/music-library}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

minio:
  url: ${MINIO_URL:http://localhost:9000}
  publicUrl: ${MINIO_PUBLIC_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:root}
  secretKey: ${MINIO_SECRET_KEY:rootpass123}
  bucket: ${MINIO_BUCKET:album-covers}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-super-secret-change-me-super-secret-32chars}
    accessTokenMinutes: 5
    refreshTokenDays: 7

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  default-flat-param-object: true
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

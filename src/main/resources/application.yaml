spring:
  application:
    name: music-library-api

  datasource:
    url: jdbc:postgresql://localhost:5432/music-library
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  minio:
    endpoint: http://localhost:9000
    access-key: admin
    secret-key: password
    bucket-name: music-covers
    expiration: 1800

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha